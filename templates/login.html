{% extends 'base.html' %}{% block title %}Login - Scribe Italia{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Accedi</h1>
  <form method="post">
    <label>Nickname<input name="nickname" required></label>
    <label>Password<input type="password" name="password" required></label>
    <button class="primary">Accedi</button>
  </form>
  <p>Non hai un account? <a href="{{ url_for('register') }}">Registrati</a></p>
</div>
{% endblock %}
